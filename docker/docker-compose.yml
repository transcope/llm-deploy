# =============================================================================
# V100 大模型推理部署 - Docker Compose 配置
# 用法:
#   docker-compose up -d vllm-server    # 启动推理服务
#   docker-compose run --rm quantize     # 运行量化
#   docker-compose run --rm benchmark    # 运行评测
# =============================================================================

services:
  # ===========================================================================
  # 基础环境 (所有服务的共同基础)
  # ===========================================================================
  vllm-base:
    build:
      context: ../
      dockerfile: docker/Dockerfile
      args:
        # true: 只安装基础环境 (torch + 系统依赖 + pip 配置), 跳过所有后续 Python 包
        # false: 按下面参数分别控制 (默认)
        - INSTALL_BASE_ONLY=false
        # true: 构建时自动安装 vLLM (默认)
        # false: 构建时跳过, 启动容器后手动安装 vllm
        - INSTALL_VLLM=true
        # true: 构建时自动安装量化工具链 (默认)
        # false: 构建时跳过, 启动容器后手动运行: bash /app/scripts/install_quant_tools.sh
        - INSTALL_QUANT_TOOLS=true
    image: llm-deploy:v100
    runtime: nvidia
    environment:
      # V100 必需环境变量
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - VLLM_ATTENTION_BACKEND=XFORMERS
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      # NCCL 配置 (V100 NVLink/PCIe)
      - NCCL_P2P_DISABLE=0
      - NCCL_IB_DISABLE=0
      - NCCL_DEBUG=WARN
      # HuggingFace
      - HF_HOME=/app/cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/app/cache/huggingface/hub
      - TRANSFORMERS_CACHE=/app/cache/huggingface/transformers
      # Python
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7
    volumes:
      # 模型挂载目录
      - ../models:/app/models
      # 评测结果
      - ../results:/app/results
      # 缓存目录 (避免重复下载)
      - ../cache:/app/cache
      # 脚本和配置
      - ../scripts:/app/scripts
      - ../configs:/app/configs
      # 可选: 挂载本地模型 (不存在时可先在宿主机创建: sudo mkdir -p /data/models)
      - /data/models:/data/models:ro
    working_dir: /app
    stdin_open: true
    tty: true
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864

  # ===========================================================================
  # vLLM 推理服务
  # ===========================================================================
  vllm-server:
    extends: vllm-base
    container_name: vllm-v100
    ports:
      - "8000:8000"
    environment:
      - CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7
    # 覆盖默认命令, 启动 vLLM 服务
    # 实际使用时通过 docker-compose run 或外部脚本传入参数
    command: >
      bash -c "echo 'vLLM server ready. Use docker exec to start service with your model.' && tail -f /dev/null"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ===========================================================================
  # 量化服务 (一次性运行)
  # ===========================================================================
  quantize:
    extends: vllm-base
    container_name: llm-quantize
    profiles: ["quantize"]
    environment:
      - CUDA_VISIBLE_DEVICES=0
    command: >
      python scripts/quantize_model.py --help
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ===========================================================================
  # 评测服务 (一次性运行)
  # ===========================================================================
  benchmark:
    extends: vllm-base
    container_name: llm-benchmark
    profiles: ["benchmark"]
    environment:
      - CUDA_VISIBLE_DEVICES=0
    command: >
      python scripts/benchmark_eval.py --help
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ===========================================================================
  # 交互式开发环境 (Jupyter)
  # ===========================================================================
  jupyter:
    extends: vllm-base
    container_name: llm-jupyter
    profiles: ["jupyter"]
    ports:
      - "8888:8888"
    environment:
      - CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7
    command: >
      bash -c "pip install jupyterlab -q &&
               jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
               --NotebookApp.token='' --NotebookApp.password=''"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ===========================================================================
  # 监控面板 (nvtop + 自定义)
  # ===========================================================================
  monitor:
    extends: vllm-base
    container_name: llm-monitor
    profiles: ["monitor"]
    environment:
      - CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7
    command: >
      watch -n 1 nvidia-smi
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
