# GPTQ W4A16 量化配置 (gptqmodel 后端, 产出标准 GPTQ 格式, V100 兼容)
#
# 背景: llmcompressor GPTQModifier 产出的 compressed-tensors 格式在 vLLM 上要求
#       SM 8.0+ (A100/A30), V100 (SM 7.0) 加载会报 "min_capability 80" 错误.
#       改用 gptqmodel 后端产出 quant_method=gptq 格式, vLLM GPTQConfig 的
#       get_min_capability()=60, V100 走 Exllama kernel, A100+ 走 Marlin.
#
# Qwen3 兼容: gptqmodel 2.0 MODEL_MAP 不含 qwen3, 量化脚本会自动安装
#             qwen3_gptq_adapter (复用 Qwen2GPTQ 结构, layer_type=Qwen3DecoderLayer)
#
# 部署: deploy_server.py --model <output> --quantization gptq --dtype float16

quantization:
  method: gptq
  gptq_backend: gptqmodel     # 产出标准 GPTQ 格式 (V100 Exllama 兼容)
  w_bit: 4
  group_size: 128
  desc_act: true              # 激活排序, 提升精度
  sym: true                   # 对称量化
  static_groups: false
  batch_size: 1               # gptqmodel.quantize 单卡逐样本, V100 32G 安全
  targets: ["Linear"]
  ignore: ["lm_head"]

calibration:
  # 230 条领域校准数据 V2（过滤超长序列，适配 V100 单卡量化）
  num_samples: 230
  # 自定义校准数据 (最高优先级)
  custom_data: "data/calibration/calibration_data_v2.jsonl"
  dataset: "neuralmagic/LLM_compression_calibration"  # 回退：当 custom_data 不可用时使用
  format: "chat_template"
  # HF 镜像与缓存 (容器内必需, 宿主机可省略)
  hf_endpoint: "https://hf-mirror.com"
  hf_cache: "/volume/hf_cache"
  # 校准数据已预下载到 /volume/hf_cache/hub, 但 gptqmodel 路径不需要 load_dataset,
  # 由 quantize_model.get_calibration_texts 内部 load_dataset 处理, 这里保持离线避免 HEAD
  hf_offline: true

output:
  format: "huggingface"
  safetensors: true
  shard_size: "4GB"

# V100 部署时使用的 vLLM 参数
vllm_deploy:
  quantization: "gptq"        # GPTQ 格式 (gptqmodel 后端产出)
  dtype: "float16"            # V100 不支持 bfloat16
  gpu_memory_utilization: 0.90
  max_model_len: 32768
  trust_remote_code: true
  enable_prefix_caching: true
