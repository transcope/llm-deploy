# vLLM 服务默认配置
# 用法: python llm_deploy/deploy_server.py --model <MODEL> --config configs/vllm_serve.yaml

# 通用推理优化参数
gpu-memory-utilization: 0.9
enable-prefix-caching: true
enable-chunked-prefill: true
trust-remote-code: true
swap-space: 16

# 默认不启用，按需开启
# kv-cache-dtype: fp8
# max-num-batched-tokens: 512
# max-num-seqs: 256

# 模型级部署预设
model_presets:
  qwen2.5-7b:
    max-model-len: 32768
    gpu-memory-utilization: 0.9

  qwen2.5-32b:
    max-model-len: 32768
    tensor-parallel-size: 2
    gpu-memory-utilization: 0.92

  deepseek-r1-distill-qwen-14b:
    max-model-len: 8192
    gpu-memory-utilization: 0.92
    tool-call-parser: deepseek_v3

  qwen2.5-vl:
    max-model-len: 32768
    multimodal: true
    max-images: 5
